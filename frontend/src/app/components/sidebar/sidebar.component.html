<div class="sidebar-header pb-4 pt-4 border-bottom-1 border-gray-200">
  <div class="brand-container flex flex-column align-items-center justify-content-center gap-1 cursor-pointer transition-all transition-duration-300 hover:-translate-y-1">
    
    <div class="brand-icon-wrapper relative" style="width: 80px; height: 80px;">
        <svg viewBox="0 0 300 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
          <defs>
            <linearGradient id="greenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22c55e" />
              <stop offset="100%" stop-color="#15803d" />
            </linearGradient>
            <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#1e3a8a" />
            </linearGradient>
            <g id="handSidebar">
               <path d="M 148 210 C 120 210 70 190 50 130 C 45 110 40 95 40 90 C 40 85 46 85 48 90 C 55 105 60 120 78 140 L 72 105 C 70 98 76 98 78 105 C 85 125 90 135 102 155 L 100 125 C 98 118 104 118 106 125 C 112 140 125 160 148 185 Z" fill="url(#greenGrad2)" />
            </g>
            <g id="figureSidebar">
               <circle cx="108" cy="90" r="14" />
               <path d="M 105 115 C 90 110 75 100 58 85 C 64 95 80 125 95 130 C 105 160 115 190 130 205 C 125 185 125 155 120 140 C 130 125 140 100 145 80 C 135 90 125 110 118 115 Z" />
            </g>
          </defs>

          <path d="M 45 110 A 105 105 0 0 1 255 110" fill="none" stroke="url(#greenGrad2)" stroke-width="6" stroke-linecap="round" />
          
          <use href="#handSidebar" />
          <use href="#handSidebar" transform="translate(300, 0) scale(-1, 1)" />

          <use href="#figureSidebar" fill="url(#blueGrad2)" />
          <use href="#figureSidebar" fill="url(#blueGrad2)" transform="translate(300, 0) scale(-1, 1)" />

          <g fill="url(#blueGrad2)">
            <rect x="145" y="150" width="10" height="28" rx="2" />
            <rect x="136" y="159" width="28" height="10" rx="2" />
          </g>
        </svg>
    </div>

    <div class="text-center mt-2">
        <h1 class="m-0 font-black" style="font-size: 1.5rem; letter-spacing: 0.5px; line-height: 1.1;">
            <span style="background: linear-gradient(to right, #22c55e, #15803d); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">CITY</span>
            <span style="background: linear-gradient(to right, #3b82f6, #1e3a8a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;" class="ml-2">CARE</span>
        </h1>
        <h2 class="m-0 font-bold mt-1" style="font-size: 0.8rem; letter-spacing: 3px; color: #1e3a8a; text-transform: uppercase;">
            Hospitals
        </h2>
    </div>
  </div>
</div>
